<div class="resourcelist ob-resource-list routes-list">
  <mat-card class="resource-header">
    <mat-card-title>
      <div class="title-block">
        <div style="width: 50px">
          <obc-icon-button
            (click)="close()"
            matTooltip="Close Route List"
            matTooltipPosition="right"
            aria-label="Close Route List"
          >
            <mat-icon>arrow_back</mat-icon>
          </obc-icon-button>
        </div>
        <div class="resource-heading">Routes</div>
      </div>
    </mat-card-title>
    <mat-card-content>
      <div class="resource-filter">
        <div class="resource-search">
          <mat-form-field floatLabel="always" subscriptSizing="dynamic">
            <mat-label>Type to filter list</mat-label>
            <input
              #ftext
              type="text"
              matInput
              [(ngModel)]="filterText"
              (keyup)="filterKeyUp(ftext.value)"
            />
            @if(filterText) {
            <obc-icon-button
              matSuffix
              (click)="filterKeyUp('')"
              aria-label="Clear filter"
            >
              <mat-icon>close</mat-icon>
            </obc-icon-button>
            }
          </mat-form-field>
        </div>
        <div>
          <obc-icon-button
            [disabled]="disableRefresh()"
            (click)="initItems()"
            matTooltip="Reload Routes"
            matTooltipPosition="below"
            aria-label="Reload Routes"
          >
            <mat-icon>refresh</mat-icon>
          </obc-icon-button>
        </div>
        <div>
          <mat-checkbox
            #selall
            [disabled]="fullList.length === 0 || disableRefresh()"
            [checked]="allSel"
            [indeterminate]="someSel"
            (change)="toggleAll($event.checked)"
            [matTooltip]="(!selall.checked || someSel) ? 'Select All' : 'Deselect All'"
            matTooltipPosition="below"
          >
          </mat-checkbox>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <div class="resources">
    @if(this.app.sIsFetching()) {
    <mat-progress-bar mode="query"></mat-progress-bar>
    }
    <cdk-virtual-scroll-viewport class="vscroller" itemSize="160">
      <mat-card
        *cdkVirtualFor="let r of filteredList(); let i= index;"
        class="resource-row"
      >
        <mat-card-content>
          <div style="display: flex; padding-left: 5px">
            <div class="resource-details">
              <div
                style="
                  padding-top: 11px;
                  text-overflow: ellipsis;
                  overflow-x: hidden;
                  white-space: pre;
                "
              >
                <b>{{r[1].name}}</b>
              </div>
              <remark
                [processor]="mdProcessor"
                style="
                  flex: 1 1 auto;
                  text-align: left;
                  font-style: italic;
                  overflow: hidden;
                  display: -webkit-box;
                  -webkit-box-orient: vertical;
                  -webkit-line-clamp: 2;
                  line-clamp: 2;
                  text-overflow: ellipsis;
                "
                [markdown]="r[1].description ?? ''"
              >
                <ng-template remarkTemplate="heading" let-node>
                  <h1 [remarkNode]="node" style="font-size: 10pt"></h1>
                </ng-template>
              </remark>
              <div>
                <i>{{formatDistance(r[1].distance)}} </i>
              </div>
            </div>
            <div style="text-align: right">
              <mat-checkbox
                [checked]="r[2]"
                [disabled]="r[0] === activeRoute() || disableRefresh()"
                (change)="itemSelect($event.checked, r[0])"
                matTooltip="Show on Map"
                matTooltipPosition="left"
              >
              </mat-checkbox>
            </div>
          </div>
        </mat-card-content>
        <mat-card-actions>
          <div style="display: flex">
            <div style="flex: 1 1 auto">
              <obc-icon-button
                (click)="itemDelete(r[0])"
                [disabled]="r[0] === activeRoute() || disableRefresh()"
                matTooltip="Delete Route"
                matTooltipPosition="above"
                aria-label="Delete Route"
              >
                <mat-icon>delete</mat-icon>
              </obc-icon-button>
              <obc-icon-button
                (click)="itemViewNotes(r)"
                matTooltip="Route notes"
                matTooltipPosition="above"
                aria-label="Route notes"
              >
                <mat-icon>local_offer</mat-icon>
              </obc-icon-button>
              <obc-icon-button
                [disabled]="disableRefresh()"
                (click)="itemViewPoints(r[0])"
                matTooltip="Route points"
                matTooltipPosition="above"
                aria-label="Route points"
              >
                <mat-icon>flag</mat-icon>
              </obc-icon-button>
              @if(r[0] !== activeRoute()) {
              <obc-icon-button
                [disabled]="disableRefresh()"
                (click)="itemSetActive(r[0])"
                matTooltip="Start"
                matTooltipPosition="above"
                aria-label="Start"
              >
                <mat-icon>near_me</mat-icon>
              </obc-icon-button>
              } @else {
              <obc-icon-button
                [disabled]="disableRefresh()"
                (click)="itemClearActive(r[0])"
                matTooltip="Stop Navigating"
                matTooltipPosition="above"
                aria-label="Stop Navigating"
              >
                <mat-icon>clear_all</mat-icon>
              </obc-icon-button>
              }
            </div>
            <div>
              <obc-icon-button
                [disabled]="disableRefresh()"
                (click)="itemProperties(r[0])"
                matTooltip="Edit Route Properties"
                matTooltipPosition="above"
                aria-label="Edit Route Properties"
              >
                <mat-icon>edit</mat-icon>
              </obc-icon-button>
            </div>
            @if(app.featureFlags().resourceGroups) {
            <div>
              <obc-icon-button
                [disabled]="disableRefresh()"
                (click)="itemAddToGroup(r[0])"
                matTooltip="Add to Group"
                matTooltipPosition="above"
                aria-label="Add to Group"
              >
                <mat-icon>category</mat-icon>
              </obc-icon-button>
            </div>
            }
          </div>
        </mat-card-actions>
      </mat-card>
    </cdk-virtual-scroll-viewport>
  </div>
</div>
